<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body class="w-full h-screen bg-white flex flex-col items-center justify-center text-white p-4">

<p class="mt-6 text-xl tracking-wide bg-black/20 px-4 py-2 rounded font-mono">
    Card Data: <span id="card-data-display">Loading...</span>
</p>

<a href="index.html" class="mt-8 border-2 p-2 font-bold hover:bg-white hover:text-green-600 transition-colors">
    Go Back
</a>

<script type="module">
    const latestSwipe = sessionStorage.getItem('latest_swipe');
    const displayElement = document.getElementById('card-data-display');
    
    if (latestSwipe) {
    displayElement.textContent = latestSwipe;
    } else {
    displayElement.textContent = "No Scan Data Found";
    }
</script>
</body>
</html>
